<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会議の時間コスト計算機</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2430;
      --muted: #5b6575;
      --border: #d7dce3;
      --accent: #2563eb;
      --accent-bg: #eef3ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b2029;
        --text: #e7eaf0;
        --muted: #9aa4b2;
        --border: #2f3744;
        --accent: #7aa2ff;
        --accent-bg: #1e2a44;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 16px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .field { margin-bottom: 18px; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      font-size: 1.1rem;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .unit { color: var(--muted); min-width: 3em; }
    .result {
      margin-top: 8px;
      padding: 16px;
      border-radius: 10px;
      background: var(--accent-bg);
      text-align: center;
    }
    .result .label { color: var(--muted); font-size: 0.9rem; }
    .total {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .formula { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>会議の時間コスト計算機</h1>
    <p class="lead">参加人数・会議時間・1時間あたりの単価から、会議の合計コストを計算します。</p>

    <div class="card">
      <div class="field">
        <label for="people">参加人数</label>
        <div class="input-row">
          <input id="people" type="number" inputmode="numeric" min="0" step="1" value="5">
          <span class="unit">人</span>
        </div>
      </div>
      <div class="field">
        <label for="hours">会議時間</label>
        <div class="input-row">
          <input id="hours" type="number" inputmode="decimal" min="0" step="0.25" value="1">
          <span class="unit">時間</span>
        </div>
      </div>
      <div class="field">
        <label for="rate">1時間あたりの単価（1人あたり）</label>
        <div class="input-row">
          <input id="rate" type="number" inputmode="numeric" min="0" step="100" value="3000">
          <span class="unit">円</span>
        </div>
      </div>

      <div class="result" aria-live="polite">
        <div class="label">合計コスト</div>
        <div class="total" id="total">0円</div>
        <div class="formula" id="formula"></div>
      </div>
    </div>
  </main>

  <script>
    const people = document.getElementById("people");
    const hours = document.getElementById("hours");
    const rate = document.getElementById("rate");
    const total = document.getElementById("total");
    const formula = document.getElementById("formula");
    const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY" });
    const comma = new Intl.NumberFormat("ja-JP");

    function num(el) {
      const v = parseFloat(el.value);
      return Number.isFinite(v) && v > 0 ? v : 0;
    }

    function update() {
      const p = num(people), h = num(hours), r = num(rate);
      total.textContent = `${comma.format(Math.round(p * h * r))}円`;
      formula.textContent = `${p}人 × ${h}時間 × ${yen.format(r)}`;
    }

    [people, hours, rate].forEach(el => el.addEventListener("input", update));
    update();
  </script>
</body>
</html>
